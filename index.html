<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Tiny Transformer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #output {
            background: #1f2937;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
        }

        button {
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>🧠 My Tiny Transformer</h1>

<button onclick="run()">Run</button>

<div id="output">Waiting...</div>

<script>

function run() {

    const output = document.getElementById("output");

    // Our tiny vocabulary
    const vocabulary = [
        "hello",
        "world",
        "I",
        "am",
        "an",
        "AI"
    ];

    output.textContent =
        "Vocabulary:\n\n" +
        vocabulary.join(", ") +
        "\n\nOur AI has " +
        vocabulary.length +
        " possible tokens.";

}

</script>

</body>
</html>

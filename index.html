<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Tiny Transformer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        #output {
            background: #1f2937;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h1>🧠 My Tiny Transformer</h1>

<textarea id="input">hello world I am an AI</textarea>

<br>

<button onclick="tokenize()">Tokenize</button>

<div id="output">Waiting...</div>

<script>

const vocabulary = [
    "<PAD>",
    "<UNK>",
    "hello",
    "world",
    "I",
    "am",
    "an",
    "AI"
];

function tokenize() {

    const text = document
        .getElementById("input")
        .value
        .trim();

    const words = text.split(/\s+/);

    const tokenIDs = words.map(word => {

        const index = vocabulary.indexOf(word);

        // Unknown words become <UNK>
        if (index === -1) {
            return 1;
        }

        return index;
    });

    document.getElementById("output").textContent =
        "Text:\n" +
        text +
        "\n\nTokens:\n" +
        words.join(" | ") +
        "\n\nToken IDs:\n" +
        tokenIDs.join(", ");

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Tiny Transformer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        #output {
            background: #1f2937;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            white-space: pre-wrap;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<h1>🧠 My Tiny Transformer</h1>

<textarea id="input">hello world I am an AI</textarea>

<br>

<button onclick="run()">Create Embeddings</button>

<div id="output">Waiting...</div>

<script>

const vocabulary = [
    "<PAD>",
    "<UNK>",
    "hello",
    "world",
    "I",
    "am",
    "an",
    "AI"
];

const embeddingSize = 8;

// -----------------------------
// EMBEDDINGS
// -----------------------------

const embeddings = [];

for (let token = 0; token < vocabulary.length; token++) {

    const vector = [];

    for (let i = 0; i < embeddingSize; i++) {

        vector.push(
            (Math.random() * 2 - 1) * 0.1
        );

    }

    embeddings.push(vector);
}


// -----------------------------
// TOKENIZER
// -----------------------------

function tokenize(text) {

    const words = text.trim().split(/\s+/);

    return words.map(word => {

        const index = vocabulary.indexOf(word);

        if (index === -1) {
            return 1;
        }

        return index;

    });
}


// -----------------------------
// RANDOM MATRIX
// -----------------------------

function randomMatrix(rows, cols) {

    const matrix = [];

    for (let i = 0; i < rows; i++) {

        const row = [];

        for (let j = 0; j < cols; j++) {

            row.push(
                (Math.random() * 2 - 1) * 0.1
            );

        }

        matrix.push(row);
    }

    return matrix;
}


// -----------------------------
// MATRIX × VECTOR
// -----------------------------

function matVec(matrix, vector) {

    const result = [];

    for (let i = 0; i < matrix.length; i++) {

        let sum = 0;

        for (let j = 0; j < vector.length; j++) {

            sum += matrix[i][j] * vector[j];

        }

        result.push(sum);
    }

    return result;
}


// -----------------------------
// DOT PRODUCT
// -----------------------------

function dot(a, b) {

    let sum = 0;

    for (let i = 0; i < a.length; i++) {

        sum += a[i] * b[i];

    }

    return sum;
}


// -----------------------------
// SOFTMAX
// -----------------------------

function softmax(values) {

    const max = Math.max(...values);

    const expValues = values.map(
        x => Math.exp(x - max)
    );

    const total = expValues.reduce(
        (a, b) => a + b,
        0
    );

    return expValues.map(
        x => x / total
    );
}


// -----------------------------
// SELF ATTENTION
// -----------------------------

function selfAttention(tokens) {

    const dimension = embeddingSize;

    // Random learned matrices
    const Wq = randomMatrix(
        dimension,
        dimension
    );

    const Wk = randomMatrix(
        dimension,
        dimension
    );

    const Wv = randomMatrix(
        dimension,
        dimension
    );

    // Create Q, K and V
    const Q = [];
    const K = [];
    const V = [];

    for (const token of tokens) {

        const embedding = embeddings[token];

        Q.push(matVec(Wq, embedding));
        K.push(matVec(Wk, embedding));
        V.push(matVec(Wv, embedding));

    }

    // Calculate attention
    const outputs = [];

    for (let i = 0; i < tokens.length; i++) {

        const scores = [];

        for (let j = 0; j < tokens.length; j++) {

            const score =
                dot(Q[i], K[j]) /
                Math.sqrt(dimension);

            scores.push(score);

        }

        const weights = softmax(scores);

        const output =
            new Array(dimension).fill(0);

        for (let j = 0; j < tokens.length; j++) {

            for (let d = 0; d < dimension; d++) {

                output[d] +=
                    weights[j] * V[j][d];

            }

        }

        outputs.push(output);

    }

    return outputs;
}


// -----------------------------
// RUN
// -----------------------------

function run() {

    const text =
        document.getElementById("input").value;

    const tokens = tokenize(text);

    const attention =
        selfAttention(tokens);

    let result = "";

    result += "Tokens:\n";

    for (let i = 0; i < tokens.length; i++) {

        result +=
            vocabulary[tokens[i]] +
            " (" +
            tokens[i] +
            ")\n";

    }

    result += "\nSelf-Attention Output:\n\n";

    for (let i = 0; i < attention.length; i++) {

        result +=
            vocabulary[tokens[i]] +
            " → [" +
            attention[i]
                .map(x => x.toFixed(4))
                .join(", ") +
            "]\n\n";

    }

    document.getElementById("output")
        .textContent = result;
}

</script>

</body>
</html>

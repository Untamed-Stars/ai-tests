<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Tiny AI - Training</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            background: #3b82f6;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            background: #555;
        }

        #output {
            background: #1f2937;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h1>🧠 My Tiny AI</h1>

<button id="trainButton" onclick="train()">
    Train AI
</button>

<button onclick="predict()">
    Test AI
</button>

<div id="output">
    Ready to train!
</div>

<script>

// ==========================================
// VOCABULARY
// ==========================================

const vocabulary = [
    "hello",
    "world",
    "I",
    "am",
    "an",
    "AI"
];

const vocabSize = vocabulary.length;


// ==========================================
// TRAINING DATA
// ==========================================

// Input → expected next word

const trainingData = [

    ["hello", "world"],
    ["I", "am"],
    ["am", "an"],
    ["an", "AI"]

];


// ==========================================
// MODEL WEIGHTS
// ==========================================

// Each input word gets a score for every
// possible output word.

const weights = [];

for (let i = 0; i < vocabSize; i++) {

    const row = [];

    for (let j = 0; j < vocabSize; j++) {

        row.push(
            (Math.random() * 2 - 1) * 0.1
        );

    }

    weights.push(row);

}


// ==========================================
// LEARNING RATE
// ==========================================

const learningRate = 0.1;


// ==========================================
// SOFTMAX
// ==========================================

function softmax(values) {

    const max =
        Math.max(...values);

    const expValues =
        values.map(
            x => Math.exp(x - max)
        );

    const total =
        expValues.reduce(
            (a, b) => a + b,
            0
        );

    return expValues.map(
        x => x / total
    );

}


// ==========================================
// WORD → ID
// ==========================================

function wordToID(word) {

    return vocabulary.indexOf(word);

}


// ==========================================
// ID → WORD
// ==========================================

function idToWord(id) {

    return vocabulary[id];

}


// ==========================================
// TRAIN
// ==========================================

async function train() {

    const button =
        document.getElementById(
            "trainButton"
        );

    button.disabled = true;

    const output =
        document.getElementById(
            "output"
        );


    const epochs = 1000;


    for (
        let epoch = 0;
        epoch < epochs;
        epoch++
    ) {

        let totalLoss = 0;


        // Go through every training example

        for (const example of trainingData) {

            const inputWord =
                example[0];

            const targetWord =
                example[1];


            const inputID =
                wordToID(inputWord);

            const targetID =
                wordToID(targetWord);


            // --------------------------------
            // FORWARD PASS
            // --------------------------------

            const logits =
                weights[inputID];


            const probabilities =
                softmax(logits);


            // --------------------------------
            // LOSS
            // --------------------------------

            const probability =
                probabilities[targetID];


            const loss =
                -Math.log(
                    Math.max(
                        probability,
                        1e-10
                    )
                );


            totalLoss += loss;


            // --------------------------------
            // BACKPROPAGATION
            // --------------------------------

            for (
                let j = 0;
                j < vocabSize;
                j++
            ) {

                let gradient =
                    probabilities[j];

                if (j === targetID) {

                    gradient -= 1;

                }


                // Gradient descent

                weights[inputID][j] -=
                    learningRate *
                    gradient;

            }

        }


        // --------------------------------
        // DISPLAY PROGRESS
        // --------------------------------

        if (
            epoch % 50 === 0 ||
            epoch === epochs - 1
        ) {

            output.textContent =
                "Training...\n\n" +
                "Epoch: " +
                epoch +
                " / " +
                epochs +
                "\n\n" +
                "Loss: " +
                totalLoss.toFixed(4);

            // Let the browser breathe

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        0
                    )
            );

        }

    }


    output.textContent =
        "🎉 Training finished!\n\n" +
        "The model has learned the training examples.\n\n" +
        "Try pressing 'Test AI'.";

    button.disabled = false;

}


// ==========================================
// PREDICT
// ==========================================

function predict() {

    const input =
        prompt(
            "Enter a word:\n\n" +
            vocabulary.join(", ")
        );


    if (!input) return;


    const inputID =
        wordToID(
            input.trim()
        );


    if (inputID === -1) {

        alert(
            "I don't know that word yet."
        );

        return;

    }


    const probabilities =
        softmax(
            weights[inputID]
        );


    let bestID = 0;

    for (
        let i = 1;
        i < vocabSize;
        i++
    ) {

        if (
            probabilities[i] >
            probabilities[bestID]
        ) {

            bestID = i;

        }

    }


    document
        .getElementById("output")
        .textContent =

        "Input:\n" +
        input +

        "\n\nPrediction:\n" +
        idToWord(bestID) +

        "\n\nConfidence:\n" +
        (
            probabilities[bestID] * 100
        ).toFixed(2) +
        "%";

}

</script>

</body>
</html>

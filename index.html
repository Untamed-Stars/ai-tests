<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Tiny Transformer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        #output {
            background: #1f2937;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            white-space: pre-wrap;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<h1>🧠 My Tiny Transformer</h1>

<textarea id="input">hello world I am an AI</textarea>

<br>

<button onclick="run()">Create Embeddings</button>

<div id="output">Waiting...</div>

<script>

const vocabulary = [
    "<PAD>",
    "<UNK>",
    "hello",
    "world",
    "I",
    "am",
    "an",
    "AI"
];

// Size of each embedding vector
const embeddingSize = 8;

// Create our embedding table
const embeddings = [];

for (let token = 0; token < vocabulary.length; token++) {

    const vector = [];

    for (let i = 0; i < embeddingSize; i++) {

        // Small random number
        vector.push(
            (Math.random() * 2 - 1) * 0.1
        );

    }

    embeddings.push(vector);
}

function tokenize(text) {

    const words = text.trim().split(/\s+/);

    return words.map(word => {

        const index = vocabulary.indexOf(word);

        if (index === -1) {
            return 1;
        }

        return index;

    });
}

function run() {

    const text = document
        .getElementById("input")
        .value;

    const tokenIDs = tokenize(text);

    let result = "";

    for (const id of tokenIDs) {

        result +=
            vocabulary[id] +
            " (" + id + ")\n";

        result +=
            "[" +
            embeddings[id]
                .map(x => x.toFixed(4))
                .join(", ") +
            "]\n\n";
    }

    document.getElementById("output").textContent = result;
}

</script>

</body>
</html>
